<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- live player counts come from here on load -->
    <link rel="preconnect" href="https://games.roproxy.com" crossorigin />
    <noscript><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@700&display=swap" rel="stylesheet" /></noscript>
    <link rel="preload" as="image" href="brand/mark-nav.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="brand/wordmark-nav.webp" />
    <title>Nex Games</title>
    <meta name="description" content="Nex Games — data-driven Roblox LiveOps, thumbnails and game acquisitions." />
    <!-- tab icon: NG mark on a dark tile so it reads on light and dark tab bars -->
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="brand/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="brand/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="brand/icon-192.png" />
    <link rel="apple-touch-icon" href="brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />
    <!-- link previews (Discord, X, iMessage…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nex Games" />
    <meta property="og:title" content="Nex Games" />
    <meta property="og:description" content="Data-driven Roblox LiveOps, thumbnails and game acquisitions." />
    <link rel="canonical" href="https://nexgames.dev/" />
    <meta property="og:url" content="https://nexgames.dev/" />
    <meta property="og:image" content="https://nexgames.dev/brand/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
